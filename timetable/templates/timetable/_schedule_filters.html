<form method="get" class="filters" id="schedule-filters">
  <input type="hidden" name="period" value="{{ form.period.value|default:'week' }}">
  <input type="hidden" name="anchor" value="{{ form.anchor.value|default:'' }}">

  <div class="filters-row">
    <div>
      <label for="{{ form.employee.id_for_label }}">Преподаватели</label>
      {{ form.employee }}
    </div>
    <div>
      <label for="{{ form.base.id_for_label }}">База</label>
      {{ form.base }}
    </div>
    <div>
      <label for="id_cycle">Цикл</label>
      <select name="cycle" id="id_cycle">
        <option value="">— все —</option>
        {% for c in cycles %}
          <option value="{{ c.pk }}" data-base="{{ c.base_id }}"
                  {% if selected_cycle.pk == c.pk %}selected{% endif %}>
            {{ c.start_date|date:"d.m.Y" }} {{ c.name|truncatechars:40 }}
          </option>
        {% endfor %}
      </select>
    </div>
  </div>

  <div class="filters-row">
    {% if period != 'custom' %}
      <div class="period-nav">
        <a class="button"
           href="{% querystring period=period anchor=prev_anchor|date:'Y-m-d' %}">←</a>
      </div>
    {% endif %}

    <div class="period-tabs">
      <a class="period-tab {% if period == 'week' %}active{% endif %}"
         href="{% querystring period='week' anchor=None start=None end=None %}">Неделя</a>
      <a class="period-tab {% if period == 'month' %}active{% endif %}"
         href="{% querystring period='month' anchor=None start=None end=None %}">Месяц</a>
      <a class="period-tab {% if period == 'year' %}active{% endif %}"
         href="{% querystring period='year' anchor=None start=None end=None %}">Учебный год</a>
      <a class="period-tab {% if period == 'custom' %}active{% endif %}"
         href="{% querystring period='custom' anchor=None start=grid.start|date:'Y-m-d' end=grid.end|date:'Y-m-d' %}">Произвольный</a>
    </div>

    {% if period == 'custom' %}
      <div class="field-inline">
        <label for="{{ form.start.id_for_label }}">С</label>
        {{ form.start }}
      </div>
      <div class="field-inline">
        <label for="{{ form.end.id_for_label }}">По</label>
        {{ form.end }}
      </div>
    {% endif %}

    {% if period != 'custom' %}
      <div class="period-nav">
        <a class="button"
           href="{% querystring period=period anchor=next_anchor|date:'Y-m-d' %}">→</a>
      </div>
    {% endif %}

    <div class="period-nav">
      <a href="{% querystring base=None cycle=None employee=None period='week' anchor=None %}">Сбросить</a>
    </div>
  </div>
</form>

<script>
  (function () {
    const form = document.getElementById('schedule-filters');
    if (!form) return;

    const baseSelect  = document.getElementById('id_base');
    const cycleSelect = form.querySelector('#id_cycle');
    const startInput  = form.querySelector('#id_start');
    const endInput    = form.querySelector('#id_end');

    // Копия всех опций цикла — неприкосновенный запас для пересборки.
    const allCycleOptions = cycleSelect
      ? Array.from(cycleSelect.options).map(o => o.cloneNode(true))
      : [];

    function filterCycles() {
      if (!baseSelect || !cycleSelect) return;
      const baseId = baseSelect.value;
      const current = cycleSelect.value;

      cycleSelect.innerHTML = '';
      for (const opt of allCycleOptions) {
        const optBase = opt.getAttribute('data-base');
        if (!opt.value || !baseId || optBase === baseId) {
          cycleSelect.appendChild(opt.cloneNode(true));
        }
      }
      cycleSelect.value = current;
    }

    // На старте: если база пришла из GET — фильтруем циклы под неё.
    if (baseSelect && cycleSelect && baseSelect.value) {
      filterCycles();
    }

    // Смена базы: фильтруем список и отправляем форму.
    if (baseSelect) {
      baseSelect.addEventListener('change', () => {
        filterCycles();
        form.submit();
      });
    }

    // Смена цикла — отправка формы.
    if (cycleSelect) {
      cycleSelect.addEventListener('change', () => form.submit());
    }

    // Изменение дат — отправка формы.
    if (startInput) startInput.addEventListener('change', () => form.submit());
    if (endInput)   endInput.addEventListener('change',   () => form.submit());

    // Enter в поле преподавателей — отправка формы.
    const employeeInput = form.querySelector('#id_employee');
    if (employeeInput) {
      employeeInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          form.submit();
        }
      });
    }
  })();
</script>
