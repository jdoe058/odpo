<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Расписание{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body { font: 14px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif;
           margin: 0; color: #222; background: #f5f5f5; }
    header { background: #1f4e79; color: #fff; padding: 12px 20px; }
    header a { color: #cfe2f3; text-decoration: none; margin-right: 16px; }
    header a:hover { color: #fff; }
    main { padding: 20px; max-width: 1400px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 0 0 16px; }
    a.button { display: inline-block; padding: 4px 10px; background: #1f4e79;
               color: #fff; border-radius: 3px; text-decoration: none; border: none;
               cursor: pointer; font-size: 13px; }
    a.button:hover { background: #163a5a; }
    .muted { color: #777; }

    .overtime-box {
      background: #fff3f3;
      border-left: 4px solid #c00;
      border-radius: 4px;
      padding: 16px 20px;
      margin-bottom: 20px;
    }
    .overtime-box.overtime-ok {
      background: #f1f8f1;
      border-left-color: #2e7d32;
    }
    .overtime-box h2 {
      font-size: 16px;
      margin: 0 0 12px;
      color: #b00020;
    }
    .overtime-box.overtime-ok h2 { color: #2e7d32; }
    .overtime-emp { margin-bottom: 14px; }
    .overtime-emp:last-child { margin-bottom: 0; }
    .overtime-header { margin-bottom: 4px; }
    .overtime-days {
      margin: 0;
      padding-left: 22px;
      color: #444;
      font-size: 13px;
    }
    .excess { color: #b00020; }

  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <header>
    <a href="{% url 'timetable:schedule_grid' %}">Расписание</a>
    {% if request.user.is_staff %}
      <a href="/admin/">Админка</a>
    {% endif %}

    <span style="float:right">
      {% if request.user.is_authenticated %}
        {{ request.user.username }}
        <form method="post" action="{% url 'logout' %}" style="display:inline">
          {% csrf_token %}
          <button type="submit"
                  style="background:none;border:none;color:#cfe2f3;
                        cursor:pointer;font:inherit;padding:0;margin-left:8px">
            Выйти
          </button>
        </form>
      {% else %}
        <a href="{% url 'login' %}">Войти</a>
      {% endif %}
    </span>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
